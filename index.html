<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14101f; --card:#221b38; --card2:#2b2347; --line:#3a3160;
    --txt:#f3efe6; --mut:#a59fc0;
    --gold:#ffb703; --ink:#2a1d00; --teal:#2ec4b6; --pink:#ff5d8f;
    --r:14px; --rs:10px;
    --fh:'Bricolage Grotesque',system-ui,sans-serif;
    --fb:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;font-family:var(--fb)}
  [hidden]{display:none!important}
  body{
    background:
      radial-gradient(900px 500px at 90% -10%,rgba(255,183,3,.10),transparent 60%),
      radial-gradient(700px 500px at -10% 10%,rgba(46,196,182,.09),transparent 60%),
      var(--bg);
    background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.5;
  }
  h2,h3{font-family:var(--fh);letter-spacing:-.01em}
  h3{font-size:18px;margin-bottom:12px}
  :focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  .muted{color:var(--mut);font-size:13px}

  header{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 24px;background:rgba(20,16,31,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{font-family:var(--fh);font-weight:800;font-size:22px;flex:1}
  .pill{
    font-size:13px;font-weight:500;padding:6px 14px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);
  }
  .pill.live{border-color:var(--teal);color:var(--teal)}
  #userInfo{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
  #userInfo img{width:30px;height:30px;border-radius:50%;border:2px solid var(--gold)}

  button{
    background:var(--gold);color:var(--ink);border:0;border-radius:var(--rs);
    padding:9px 16px;cursor:pointer;font-size:14px;font-weight:700;
    transition:transform .12s,filter .12s;
  }
  button:hover{filter:brightness(1.08)}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
  button.ghost:hover{background:var(--card2);filter:none}
  button.small{padding:4px 10px;font-size:12px}

  .login{min-height:72vh;display:grid;place-items:center;padding:20px;text-align:center}
  .login div{
    max-width:360px;padding:40px 32px;border:1px dashed var(--line);
    border-radius:var(--r);background:var(--card);
  }
  .login h2{font-size:30px;margin-bottom:10px}

  main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
  .section-title{font-size:20px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
  .flash{
    background:var(--pink);color:#fff;border-radius:var(--rs);padding:10px 14px;
    margin-bottom:16px;font-size:14px;font-weight:500;
  }

  .admin{border-color:var(--gold);background:var(--card2)}
  .admin h2{color:var(--gold);font-size:20px;margin-bottom:8px}
  .admin label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
  .admin .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .admin .row{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
  input,textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);
    border-radius:var(--rs);padding:10px 12px;margin-top:6px;font-size:14px;
  }
  input:focus,textarea:focus{border-color:var(--gold);outline:none}
  textarea{resize:vertical;min-height:110px}
  .msg{font-size:13px;color:var(--mut);margin-top:10px;min-height:1em}

  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .tile{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;
    transition:border-color .15s;
  }
  .tile:hover{border-color:#4d4378}
  .tile.mine{border-color:var(--gold);background:linear-gradient(160deg,var(--card2),var(--card))}
  .tile .text{font-size:16px;font-weight:500;line-height:1.4;min-height:2.8em}
  .tile .meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .faces{display:flex;align-items:center;min-height:32px}
  .av{
    width:32px;height:32px;border-radius:50%;object-fit:cover;
    border:2px solid var(--card);margin-left:-8px;background:var(--bg);flex:none;
  }
  .faces .av:first-child{margin-left:0}
  .init{display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut)}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:34px}
  button.mark{background:var(--teal);color:#062b27;border-radius:999px;padding:8px 20px}
  .badge{
    font-size:13px;font-weight:700;color:var(--gold);
    padding:6px 12px;border:1px solid var(--gold);border-radius:999px;
  }
  .empty{grid-column:1/-1;padding:40px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--mut)}

  .rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .rank:last-child{border-bottom:0}
  .rank .pos{width:18px;color:var(--mut);font-weight:700;font-size:13px}
  .rank .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank b{font-family:var(--fh);font-size:15px}
  .rank .av{width:28px;height:28px;margin:0}
  .rank.winner{color:var(--gold);font-weight:700}
  .rank.winner .av{border-color:var(--gold)}

  .feed{list-style:none;max-height:360px;overflow:auto}
  .feed li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .feed li:last-child{border-bottom:0}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    .admin .grid2{grid-template-columns:1fr}
  }
  @media (max-width:560px){
    header{padding:10px 14px}
    .brand{font-size:19px}
    main{padding:16px 12px 48px}
    .board{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">🎯 Bingo</div>
  <div id="gameStatus" class="pill">—</div>
  <div id="userInfo"></div>
  <button id="authBtn" class="ghost">Entrar com Google</button>
</header>

<section id="loginBox" class="login">
  <div>
    <h2>Bingoleo</h2>
    <p class="muted">Entre com sua conta Google para marcar as frases.</p>
  </div>
</section>

<main id="app" hidden>
  <div id="flash" class="flash" hidden></div>
  <section id="adminPanel" class="card admin" hidden></section>
  <div class="layout">
    <section>
      <h2 class="section-title">Cartela</h2>
      <div id="board" class="board"></div>
    </section>
    <aside>
      <div class="card"><h3>Placar</h3><div id="ranking"></div></div>
      <div class="card"><h3>Eventos</h3><ul id="feed" class="feed"></ul></div>
    </aside>
  </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
